# hypr/hyprlock.conf
# omnix-config — omarchy pixel style
source = ~/.config/hypr/colors.conf
source = ~/.config/hypr/userconfig.conf

general {
    ignore_empty_input = true
    hide_cursor        = true
}

# ── Background ─────────────────────────────────────────────
background {
    monitor           =
    path              = ~/.config/hypr/current_wallpaper
    color             = rgb(1a1b26)
    blur_passes       = 3
    blur_size         = 5
    brightness        = 0.7
    vibrancy          = 0.15
    vibrancy_darkness = 0.2
}

# ── Animations ─────────────────────────────────────────────
animations {
    enabled = true

    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = easein,   0.4,  0.0, 1.0, 1.0
    bezier = easeout,  0.0,  0.0, 0.2, 1.0

    animation = fadeIn,          1, 5, easeout
    animation = fadeOut,         1, 4, easein
    animation = inputFieldColors, 1, 3, easeout
    animation = inputFieldDots,   1, 3, overshot
    animation = inputFieldFade,   1, 3, easeout
}

# ── Avatar ─────────────────────────────────────────────────
# Path is set in userconfig.conf via $avatar
image {
    monitor       =
    path          = $avatar
    size          = 200
    rounding      = 100
    border_size   = 2
    border_color  = rgba(7aa2f7ff)
    shadow_passes = 2
    shadow_size   = 10
    shadow_color  = rgba(0, 0, 0, 0.6)

    position = 0, 220
    halign   = center
    valign   = center
}

# ── Name label ─────────────────────────────────────────────
# Name is set in userconfig.conf via $name
label {
    monitor       =
    text          = $name
    color         = rgba(9ece6aff)
    font_size     = 100
    font_family   = Press Start 2P, JetBrainsMono NFM Bold
    shadow_passes = 2
    shadow_size   = 12
    shadow_color  = rgba(0, 0, 0, 0.5)

    position = 0, 0
    halign   = center
    valign   = center
}

# ── Password input ─────────────────────────────────────────
input-field {
    monitor           =
    size              = 380, 55
    position          = 0, -150
    halign            = center
    valign            = center

    inner_color       = rgba(ffffff08)
    outer_color       = rgba(7aa2f7cc)
    outline_thickness = 2
    rounding          = 6

    font_family       = JetBrainsMono Nerd Font
    font_color        = rgba(a9b1d6ff)

    placeholder_text  = <span foreground="##444b6a"><i>Enter Password</i></span>

    check_color       = rgba(9ece6aff)
    fail_text         = <span foreground="##f7768e"><i>$FAIL ($ATTEMPTS)</i></span>
    fail_color        = rgba(f7768eff)

    dots_size         = 0.25
    dots_spacing      = 0.4
    dots_center       = true
    dots_rounding     = -1

    shadow_passes     = 0
    fade_on_empty     = false
}

auth {
    fingerprint:enabled = false
}