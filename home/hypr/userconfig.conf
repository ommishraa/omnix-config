# Your display name shown on the lock screen
$name   = OMNIX

# Absolute path to your avatar image (must be a square image)
# To crop non-square images run:
# convert $avatar -gravity Center \
#   -extent "$(identify -format '%[fx:min(w,h)]x%[fx:min(w,h)]' $avatar)" $avatar
$avatar = /home/om/om-works/omnix-config/home/hypr/assets/avatar.png