# kitty/kitty.conf
# omnix-config — kitty terminal

# ── Font ───────────────────────────────────────────────────
font_family      JetBrainsMonoNL Nerd Font Propo Regular
bold_font        JetBrainsMonoNL Nerd Font Propo Bold
italic_font      JetBrainsMonoNL Nerd Font Propo Italic
bold_italic_font JetBrainsMonoNL Nerd Font Propo Bold Italic
font_size        11.0

# ── Cursor ─────────────────────────────────────────────────
cursor_trail         1
cursor_shape         beam
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# ── Scrollback ─────────────────────────────────────────────
scrollback_lines     4000
wheel_scroll_min_lines 1

# ── Window ─────────────────────────────────────────────────
background_opacity   0.92
window_padding_width 12
confirm_os_window_close 0
hide_window_decorations no
remember_window_size yes

# ── Tabs ───────────────────────────────────────────────────
tab_bar_style        powerline
tab_powerline_style  slanted
tab_bar_min_tabs     2

# ── Bell ───────────────────────────────────────────────────
enable_audio_bell    no
visual_bell_duration 0.0

# ── Performance ────────────────────────────────────────────
repaint_delay        8
input_delay          2
sync_to_monitor      yes

# ── Display ────────────────────────────────────────────────
linux_display_server auto

# ── Colours ────────────────────────────────────────────────
include colors.conf