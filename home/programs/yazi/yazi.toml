# yazi/yazi.toml
# omnix-config — yazi file manager

[manager]
ratio          = [1, 2, 4]   # panel ratios: parent, current, preview
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
show_hidden    = false
show_symlink   = true

[preview]
tab_size       = 2
max_width      = 1200
max_height     = 900
cache_dir      = ""
image_filter   = "triangle"
image_quality  = 75
sixel_scale    = 1.0
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
edit = [
  { run = 'nvim "$@"', desc = "Neovim", block = true },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", orphan = true },
]
reveal = [
  { run = 'xdg-open "$(dirname "$@")"', desc = "Reveal in file manager", orphan = true },
]
extract = [
  { run = 'unar "$1"', desc = "Extract here" },
]
play = [
  { run = 'mpv "$@"', orphan = true, desc = "Play" },
]
view_image = [
  { run = 'imv "$@"', orphan = true, desc = "View image" },
]

[open]
rules = [
  # Text / code → nvim
  { mime = "text/*",                          use = ["edit", "open"] },
  { mime = "application/json",                use = ["edit", "open"] },
  { mime = "application/javascript",          use = ["edit", "open"] },
  { mime = "application/x-sh",               use = ["edit", "open"] },
  { mime = "application/x-nix",              use = ["edit", "open"] },
  { mime = "application/toml",               use = ["edit", "open"] },
  { mime = "application/yaml",               use = ["edit", "open"] },

  # Images → imv or xdg-open
  { mime = "image/*",                         use = ["view_image", "open"] },

  # Video/Audio → mpv
  { mime = "video/*",                         use = ["play", "open"] },
  { mime = "audio/*",                         use = ["play", "open"] },

  # Archives → extract
  { mime = "application/zip",                 use = ["extract", "open"] },
  { mime = "application/gzip",                use = ["extract", "open"] },
  { mime = "application/x-tar",               use = ["extract", "open"] },
  { mime = "application/x-7z-compressed",     use = ["extract", "open"] },
  { mime = "application/x-rar",               use = ["extract", "open"] },

  # PDF → xdg-open
  { mime = "application/pdf",                 use = ["open"] },

  # Fallback
  { mime = "*",                               use = ["open"] },
]

[tasks]
micro_workers    = 10
macro_workers    = 25
bizarre_retry    = 5
image_alloc      = 536870912  # 512MB
image_bound      = [0, 0]
suppress_preload = false

[log]
enabled = false